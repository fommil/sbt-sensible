image: fommil/docker-openjdk-sbt:latest
cache:
  paths:
    - project/.sbt
variables:
  COURSIER_CACHE: "project/.sbt/coursier"

stages:
  - build
  - test
  - deploy

build_job:
  stage: build
  except:
    - /^feature.*$/
  script:
    - if $(git grep -qE "TODO|FIXME" *) ; then
        echo "Please remove TODO or FIXME." ;
        exit 1 ;
      fi
    - sbt ";+update ;scalafmt::test ;compile ;doc";
      if $(! git diff --exit-code --quiet) ; then
        echo "Copyright header information mismatch" ;
        git --no-pager diff ;
        exit 1 ;
      fi

test_job:
  stage: test
  except:
    - master
    - /^feature.*$/
  script:
    - sbt scripted

deploy_job:
  only:
    - master
  except:
    - tags
  stage: deploy
  script:
    - sbt publish
