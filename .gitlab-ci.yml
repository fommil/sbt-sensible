image: fommil/docker-openjdk-sbt:latest
cache:
  paths:
    - project/.sbt
variables:
  COURSIER_CACHE: "project/.sbt/coursier"

stages:
  - build
  - deploy

build_job:
  stage: build
  script:
    - if $(git grep -qE "TODO|FIXME" *) ; then
        echo "Please remove TODO or FIXME." ;
        exit 1 ;
      fi
    - sbt ";^update ;^scalafmt::test ;^headerCheck ;^compile ;^doc ;^scripted";

deploy_job:
  only:
    - master
  except:
    - tags
  stage: deploy
  script:
    - sbt ^publish
