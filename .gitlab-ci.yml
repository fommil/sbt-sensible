image: fommil/docker-openjdk-sbt:latest
variables:
  COURSIER_CACHE: "project/.sbt/coursier"

stages:
  - build
  - deploy

build_job:
  stage: build
  cache:
    key: default
    paths:
      - project/.sbt
    policy: pull
  script:
    - if $(git grep -qE "TODO|FIXME" *) ; then
        echo "Please remove TODO or FIXME." ;
        exit 1 ;
      fi
    - sbt ";scalafmtSbtCheck ;^update ;^scalafmtCheck ;^headerCheck ;^compile ;^doc ;^scripted";

deploy_job:
  only:
    - master
  except:
    - tags
  stage: deploy
  cache:
    key: default
    paths:
      - project/.sbt
  script:
    - sbt ^publish
